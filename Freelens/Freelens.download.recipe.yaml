Description: Downloads the latest version of Freelens from GitHub
Identifier: com.github.robochau01.download.freelens
MinimumVersion: '2.3'

Input:
    NAME: Freelens
    DOWNLOAD_URL: 'https://github.com/freelensapp/freelens/releases/download/v1.6.2/Freelens-1.6.2-macos-arm64.pkg'

Process:
    - Processor: URLDownloader
      Arguments:
          url: '%DOWNLOAD_URL%'
          filename: '%NAME%-latest.pkg'
    - Processor: EndOfCheckPhase
    