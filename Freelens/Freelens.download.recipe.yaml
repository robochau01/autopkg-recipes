Description: |
  Downloads the most recent signed release dmg of FreeLens from GitHub.
  FreeLens is a free and open-source Kubernetes IDE (fork of OpenLens).

  In order to get the latest pre-release, set the Input variable INCLUDE_PRERELEASES to a non-empty
  string (such as 'True'). If you just want the latest full release instead,
  INCLUDE_PRERELEASES must be set to an empty string (this is the default).

  Note: This recipe targets ARM64 (Apple Silicon) by default. For Intel builds,
  change the asset_regex to .*amd64_mac.dmg$ or .*macos-amd64.dmg$
Identifier: com.github.smithjw-actions.download.FreeLens
MinimumVersion: '2.3'

Input:
  NAME: FreeLens
  SOFTWARE_TITLE: '%NAME%'
  INCLUDE_PRERELEASES: ''
  DOWNLOAD_MISSING_FILE: null
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
  - Processor: GitHubReleasesInfoProvider
    Arguments:
      asset_regex: .*macos-arm64\.dmg$
      github_repo: freelensapp/freelens
      include_prereleases: '%INCLUDE_PRERELEASES%'

  - Processor: com.github.smithjw-actions.processors/URLDownloaderPython
    Arguments:
      download_missing_file: '%DOWNLOAD_MISSING_FILE%'
      filename: '%SOFTWARE_TITLE%.dmg'

  - Processor: EndOfCheckPhase

  - Processor: StopProcessingIf
    Arguments:
      predicate: 'download_changed == %BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED%'

  - Processor: CodeSignatureVerifier
    Arguments:
      deep_verification: true
      input_path: '%RECIPE_CACHE_DIR%/downloads/%SOFTWARE_TITLE%.dmg/Freelens.app'
      requirement: identifier "app.freelens.Freelens" and anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */ and certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */ and certificate leaf[subject.OU] = 5SF5CG6SS7
      strict_verification: true